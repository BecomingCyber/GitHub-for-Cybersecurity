name: Validate Log Parser

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "sample-data/**"
      - "tests/**"
      - ".github/workflows/validate-log-parser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # CI is one layer of validation, not proof that the analyzer is secure.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Display Python version
        run: python --version

      - name: Validate Python syntax
        run: python -m py_compile scripts/log_parser.py tests/test_log_parser.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run sample log analyzer
        run: python scripts/log_parser.py
